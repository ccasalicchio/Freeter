name: Build

on:
  push:
    branches: [master, upgrade/v3-roadmap]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run prod

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: freeter-${{ matrix.os }}
          path: release/
          if-no-files-found: warn
